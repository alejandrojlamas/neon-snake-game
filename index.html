<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <meta name="description" content="A dependency-free retro neon Snake game built with JavaScript and Canvas.">
  <title>Retro Neon Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <p class="eyebrow">Vanilla JavaScript + Canvas</p>
      <h1>Retro Neon Snake</h1>
      <p class="subtitle">Collect the pink pixels. Avoid the walls and your own trail.</p>
    </header>

    <section class="hud" aria-label="Game information">
      <p>Score: <output id="score">0</output></p>
      <p id="status" role="status">Press an arrow key or WASD to start.</p>
    </section>

    <div id="game-container">
      <canvas
        id="game"
        width="400"
        height="400"
        tabindex="0"
        aria-label="Snake game board"
        aria-describedby="instructions"
      ></canvas>
    </div>

    <div class="controls">
      <p id="instructions">Move with the arrow keys or WASD. Press Enter after a game to restart.</p>
      <button id="restart" type="button">Restart game</button>
    </div>
  </main>

  <script src="game-core.js"></script>
  <script src="snake.js"></script>
</body>
</html>
